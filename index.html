<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Hello Page</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Georgia, "Times New Roman", serif;
		}

		body {
			align-items: center;
			background: #f5f1e8;
			color: #253238;
			display: flex;
			justify-content: center;
			margin: 0;
			min-height: 100vh;
		}

		main {
			text-align: center;
		}

		h1 {
			font-size: clamp(2.5rem, 8vw, 5rem);
			margin: 0;
		}

		p {
			font-family: system-ui, sans-serif;
			font-size: 1.1rem;
			margin: 0.75rem 0 0;
		}
	</style>
</head>
<body>
	<main>
		<h1>Hello, world!</h1>
		<p>Welcome to my website.</p>
	</main>
</body>
</html>
